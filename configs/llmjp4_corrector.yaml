model:
  name: llm-jp/llm-jp-4-8b-instruct
  max_seq_length: 4096
  load_in_4bit: true
lora:
  r: 8
  alpha: 16
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
train:
  completion_only_loss: true
  use_chat_template: true
  chat_content_parts: false
  add_error_tag_tokens: false
  train_error_tag_embeddings: false
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  epochs: 3
  logging_steps: 10
  seed: 42
wandb:
  enabled: true
  project: koten-text-refiner
  entity:
  group: llmjp4-corrector
  job_type: train
  mode: online
  run_name:
  tags:
    - corrector
    - llmjp4
